[project]
name = "telco-churn-mlops"
version = "1.0.0"
description = "Week 17 Track A: reproducible Telco Customer Churn MLOps pipeline"
requires-python = ">=3.11,<3.15"
dependencies = [
  "evidently>=0.7,<1",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "mlflow>=3.3,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mlops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
