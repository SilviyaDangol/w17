[project]
name = "agentic-assistant-mlops"
version = "1.0.0"
description = "Week 17 Track B: agentic AI MLOps for the W15/W16 assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "evidently>=0.7,<1",
  "mlflow>=3.3,<4",
  "pandas>=2.2,<3",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mlops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
